name: Generate Snake
on:
  # GitHub não tem evento “nova contribuição”; o schedule mantém a snake atualizada.
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas (UTC)
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Sutil/snk está quebrado (gera só a cobra sem o grid).
      # Platane/snk@v3 já permite color_snake=blue.
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#69e3dd

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
